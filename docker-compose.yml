services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong(!)Password"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  api:
    build:
      context: ./apps/api
    environment:
      NODE_ENV: development
      API_PORT: 4000
      DATABASE_URL: "sqlserver://sqlserver:1433;database=RikiLms;user=sa;password=YourStrong(!)Password;encrypt=true;trustServerCertificate=true"
      JWT_ACCESS_SECRET: "local-development-access-secret-change-me"
      JWT_REFRESH_SECRET: "local-development-refresh-secret-change-me"
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      - sqlserver

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  sqlserver-data:
